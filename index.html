<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montak Shop</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff1f2;
  color:#fff;
  text-align:center;
}
.box{
  min-height:100vh;
  padding:70px 25px;
  box-sizing:border-box;
  background:linear-gradient(160deg,#8b1735,#b51f43,#6e102b);
}
.logo{
  font-size:55px;
  font-weight:bold;
  margin-bottom:20px;
}
h1{font-size:32px;}
p{font-size:18px;line-height:2;}
.button{
  display:inline-block;
  margin-top:25px;
  padding:14px 28px;
  border-radius:30px;
  background:#fff;
  color:#8b1735;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>
<body>
<div class="box">
  <div class="logo">★ Montak</div>
  <h1>به مونتاک شاپ خوش اومدی 🌶️</h1>
  <p>فقط یک شاپ نیست، یک سبک زندگی</p>
  <p>پاسخگویی سریع در کمترین زمان</p>
  <a class="button" href="#more">مشاهده بیشتر</a>
</div>
</body>
</html>
